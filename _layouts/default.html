<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header class="page-header" role="banner">
      <div class="header-inner">
        <div class="header-text">
          <h1 class="project-name">{{ site.title }}</h1>
          <h2 class="project-tagline">{{ site.description }}</h2>
          <nav class="site-nav">
            <a class="btn" href="{{ '/' | relative_url }}">Home</a>
            {% for item in site.data.navigation.main %}
              <a class="btn" href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% endfor %}
          </nav>
        </div>
        <img class="profile-photo" src="{{ '/profile.jpg' | relative_url }}" alt="{{ site.title }}">
      </div>
    </header>

    <main id="content" class="main-content" role="main">
      {% unless page.url == '/' %}<h1>{{ page.title }}</h1>{% endunless %}
      {{ content }}
    </main>
  </body>
</html>
