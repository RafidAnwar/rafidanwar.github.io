<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#157878">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header class="page-header home-header" role="banner">
      <nav class="home-nav">
        {% for item in site.data.navigation.main %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>

      <img class="home-photo" src="{{ '/image.jpg' | relative_url }}" alt="{{ site.title }}">
      <h1 class="home-name">{{ site.title }}</h1>

      <div class="home-socials">
        <a class="home-social hs-mail" href="mailto:{{ site.email }}" title="Email"><i class="fa-solid fa-envelope"></i></a>
        <a class="home-social hs-linkedin" href="{{ site.linkedin }}" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        <a class="home-social hs-github" href="{{ site.github }}" title="GitHub"><i class="fa-brands fa-github"></i></a>
      </div>
    </header>

    <main id="content" class="main-content home-about" role="main">
      {{ content }}
    </main>
  </body>
</html>
